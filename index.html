<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Slogan Posters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Ultra&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f6f2;
      --ink: #172b2b;
      --muted: #64716d;
      --line: #dce2dc;
      --green: #245c4a;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 40px, 760px);
      margin: 0 auto;
      padding: 42px 0 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40px;
      font-weight: 400;
      line-height: 1.05;
    }

    .source-link {
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 1px solid #c8d1ca;
      border-radius: 4px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .source-link:hover { background: #e8eee8; border-color: #9eafa3; }
    .source-link:focus-visible, button:focus-visible, canvas:focus-visible { outline: 3px solid #89b89e; outline-offset: 3px; }

    .toolbar {
      display: flex;
      min-height: 59px;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    #status {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    #status[data-state="error"] { color: #a13e34; }

    button {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid #c8d1ca;
      border-radius: 4px;
      background: transparent;
      color: var(--green);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #e8eee8; }
    button:disabled { cursor: wait; opacity: .6; }

    #posters {
      display: grid;
      justify-items: center;
      gap: 44px;
      padding-top: 32px;
    }

    .poster-item {
      width: min(100%, 500px);
      margin: 0;
      animation: arrive 420ms both;
    }

    .poster-item canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 8px 30px rgb(28 48 38 / 10%);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .poster-item canvas:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 38px rgb(28 48 38 / 15%);
    }

    figcaption {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding-top: 13px;
      color: var(--muted);
      font-size: 12px;
    }

    figcaption span { font-variant-numeric: tabular-nums; }

    .counter-note {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .empty-state {
      width: 100%;
      padding: 46px 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      text-align: center;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .page { width: min(100% - 28px, 500px); padding-top: 26px; }
      header { align-items: flex-start; flex-direction: column; gap: 17px; }
      h1 { font-size: 34px; }
      #posters { gap: 32px; padding-top: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">A collection of good words</p>
        <h1>Slogan Posters</h1>
      </div>
      <a class="source-link" href="https://docs.google.com/spreadsheets/d/1E8cGduV-j-W6C9syKmZhLFNXLrI-5bn3WiQZoWLOXc8/edit?usp=sharing" target="_blank" rel="noopener noreferrer">Open source sheet</a>
    </header>

    <section class="toolbar" aria-label="Poster controls">
      <p id="status" role="status" aria-live="polite">Loading slogans from the sheet...</p>
      <button id="refresh" type="button">Refresh</button>
    </section>
    <p class="counter-note" id="counter-note"></p>

    <section id="posters" aria-label="Slogan posters"></section>
  </main>

  <script>
    "use strict";

    const SHEET_ID = "1E8cGduV-j-W6C9syKmZhLFNXLrI-5bn3WiQZoWLOXc8";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
    const COUNTER_URL = "";
    const posterFonts = ["Anton", "Bebas Neue", "Oswald", "Ultra"];
    const palettes = [
      { paper: "#f3f5e9", ink: "#1d473a", accent: "#e1825c" },
      { paper: "#eef4f4", ink: "#214d58", accent: "#d16e53" },
      { paper: "#f7f0e8", ink: "#493d62", accent: "#d18a3d" },
      { paper: "#eef2e8", ink: "#344d32", accent: "#c56453" },
      { paper: "#f6edf0", ink: "#653d4b", accent: "#547c72" },
      { paper: "#edf1f7", ink: "#304663", accent: "#c16c4b" }
    ];

    const status = document.querySelector("#status");
    const posterList = document.querySelector("#posters");
    const refreshButton = document.querySelector("#refresh");
    const counterNote = document.querySelector("#counter-note");

    counterNote.textContent = COUNTER_URL
      ? "View and download totals sync to the sheet."
      : "Counters are session-only until COUNTER_URL is set to the deployed Apps Script web app URL.";

    function parseCsv(csv) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let index = 0; index < csv.length; index += 1) {
        const character = csv[index];
        if (quoted) {
          if (character === '"' && csv[index + 1] === '"') {
            field += '"';
            index += 1;
          } else if (character === '"') {
            quoted = false;
          } else {
            field += character;
          }
        } else if (character === '"') {
          quoted = true;
        } else if (character === ",") {
          row.push(field);
          field = "";
        } else if (character === "\n" || character === "\r") {
          if (character === "\r" && csv[index + 1] === "\n") index += 1;
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += character;
        }
      }

      if (field || row.length) {
        row.push(field);
        rows.push(row);
      }
      return rows;
    }

    function getSlogans(csv) {
      const rows = parseCsv(csv);
      const headerRowIndex = rows.findIndex((row) => row[1]?.trim().replace(/^\uFEFF/, "").toLowerCase() === "slogan");
      if (headerRowIndex < 0) throw new Error('Could not find a "Slogan" heading in column B.');
      const headers = rows[headerRowIndex].map((value) => value.trim().toLowerCase());
      const viewsColumn = headers.indexOf("view count");
      const downloadsColumn = headers.indexOf("downloads");
      return rows.slice(headerRowIndex + 1).map((row, index) => ({
        slogan: row[1]?.trim(),
        sheetRow: headerRowIndex + index + 2,
        views: viewsColumn < 0 ? 0 : Math.max(0, Math.trunc(Number(row[viewsColumn]) || 0)),
        downloads: downloadsColumn < 0 ? 0 : Math.max(0, Math.trunc(Number(row[downloadsColumn]) || 0))
      })).filter((poster) => poster.slogan);
    }

    function wrapText(context, text, maxWidth) {
      const words = text.trim().split(/\s+/);
      const lines = [];
      let line = "";

      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (line && context.measureText(candidate).width > maxWidth) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawPoster(canvas, slogan, posterIndex) {
      const context = canvas.getContext("2d");
      const palette = palettes[posterIndex % palettes.length];
      const layout = posterIndex % 4;
      const padding = layout === 1 ? 48 : 58;
      const maxWidth = 500 - padding * 2;
      const fontFamily = posterFonts[Math.floor(Math.random() * posterFonts.length)];
      const weight = fontFamily === "Oswald" ? 600 : 400;
      const baseSize = layout === 2 ? 52 : 47;
      let fontSize = baseSize;
      let lines;

      context.fillStyle = palette.paper;
      context.fillRect(0, 0, 500, 500);
      context.fillStyle = palette.accent;
      if (layout === 0) {
        context.fillRect(0, 0, 12, 500);
        context.fillRect(58, 68, 44, 4);
      } else if (layout === 1) {
        context.beginPath();
        context.arc(424, 82, 28, 0, Math.PI * 2);
        context.fill();
        context.fillRect(48, 430, 72, 3);
      } else if (layout === 2) {
        context.strokeStyle = palette.accent;
        context.lineWidth = 2;
        context.strokeRect(26, 26, 448, 448);
      } else {
        context.fillRect(58, 73, 5, 355);
        context.fillRect(58, 73, 58, 4);
        context.fillRect(58, 424, 58, 4);
      }

      while (fontSize > 14) {
        context.font = `${weight} ${fontSize}px ${fontFamily}`;
        lines = wrapText(context, slogan, maxWidth);
        if (lines.length <= 9 && lines.every((line) => context.measureText(line).width <= maxWidth)) break;
        fontSize -= 2;
      }

      context.font = `${weight} ${fontSize}px ${fontFamily}`;
      context.fillStyle = palette.ink;
      context.textAlign = "center";
      context.textBaseline = "middle";
      const center = 250;
      const lineHeight = Math.round(fontSize * 1.18);
      const textHeight = lines.length * lineHeight;
      const top = (500 - textHeight) / 2;
      lines.forEach((line, lineIndex) => {
        context.fillText(line, center, top + lineIndex * lineHeight, maxWidth);
      });

      canvas.setAttribute("aria-label", `Download poster: ${slogan}`);
      canvas.title = "Click to download this poster as a PNG";
    }

    function showEmpty(message) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = message;
      posterList.append(empty);
    }

    function updateCounts(poster, caption) {
      caption.querySelector("[data-views]").textContent = `View count ${poster.views}`;
      caption.querySelector("[data-downloads]").textContent = `Downloads ${poster.downloads}`;
    }

    function incrementCount(poster, metric, caption) {
      poster[metric] += 1;
      updateCounts(poster, caption);
      if (!COUNTER_URL) return;
      fetch(COUNTER_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ row: poster.sheetRow, metric })
      }).catch((error) => console.error("Unable to write poster count:", error));
    }

    function renderPosters(posters) {
      posterList.replaceChildren();
      posters.forEach((poster, index) => {
        const figure = document.createElement("figure");
        figure.className = "poster-item";
        figure.style.animationDelay = `${Math.min(index, 8) * 35}ms`;

        const canvas = document.createElement("canvas");
        canvas.width = 500;
        canvas.height = 500;
        canvas.tabIndex = 0;
        canvas.setAttribute("role", "button");
        drawPoster(canvas, poster.slogan, index);

        const caption = document.createElement("figcaption");
        const views = document.createElement("span");
        views.dataset.views = "";
        const downloads = document.createElement("span");
        downloads.dataset.downloads = "";
        caption.append(views, downloads);
        updateCounts(poster, caption);

        const download = () => {
          incrementCount(poster, "downloads", caption);
          const link = document.createElement("a");
          link.download = "slogan-poster.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        };
        canvas.addEventListener("click", download);
        canvas.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            download();
          }
        });

        figure.append(canvas, caption);
        posterList.append(figure);
        incrementCount(poster, "views", caption);
      });
    }

    async function loadSlogans() {
      refreshButton.disabled = true;
      status.dataset.state = "loading";
      status.textContent = "Loading slogans from the sheet...";
      try {
        const response = await fetch(CSV_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`The sheet returned HTTP ${response.status}.`);
        const posters = getSlogans(await response.text());
        if (!posters.length) {
          posterList.replaceChildren();
          showEmpty("No slogans found under the Slogan heading in column B.");
          status.textContent = "No slogans found.";
          return;
        }
        await Promise.all(posterFonts.map((font) => document.fonts.load(`600 48px "${font}"`)));
        renderPosters(posters);
        status.textContent = `${posters.length} ${posters.length === 1 ? "poster" : "posters"} from the sheet`;
        status.dataset.state = "ready";
      } catch (error) {
        posterList.replaceChildren();
        showEmpty("Slogans could not be loaded. Set the sheet to “Anyone with the link” viewer access, then refresh.");
        status.dataset.state = "error";
        status.textContent = "Could not read the sheet.";
        console.error("Unable to load slogans:", error);
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadSlogans);
    loadSlogans();
  </script>
</body>
</html>
